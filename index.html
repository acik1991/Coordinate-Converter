<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Converter | DMS to Decimal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: white; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        /* Custom scrollbar for the textarea */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center justify-center">

    <div class="max-w-4xl w-full">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-2 tracking-tight">
                <i class="fa-solid fa-map-location-dot text-blue-600 mr-2"></i>Coordinate Converter
            </h1>
            <p class="text-gray-600 text-lg">Batch convert DMS coordinates to Decimal Degrees for Excel</p>
        </div>

        <!-- Main Input Area -->
        <div class="glass-panel rounded-2xl p-6 md:p-8 mb-6 shadow-lg">
            <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Input Data (DMS)</label>
            <textarea id="inputData" class="w-full h-48 p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 font-mono text-sm transition-all outline-none resize-none" placeholder="Paste your coordinates here...

Example:
5° 56' 38.4'' N    116° 4' 55.2'' E
6° 31' 16.51'' N   116° 45' 0.40'' E"></textarea>
            
            <div class="mt-6 flex flex-wrap gap-3">
                <button onclick="convertCoords()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200 flex items-center shadow-md transform active:scale-95">
                    <i class="fa-solid fa-rotate mr-2"></i> Convert Now
                </button>
                <button onclick="clearInput()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-6 rounded-lg transition duration-200 flex items-center shadow-sm">
                    <i class="fa-solid fa-trash-can mr-2 text-gray-400"></i> Clear
                </button>
            </div>
        </div>

        <!-- Results Area (Hidden by default) -->
        <div id="resultsArea" class="hidden animate-fade-in-up">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center">
                    <i class="fa-solid fa-table-list mr-2 text-emerald-500"></i> Results
                    <span id="countBadge" class="ml-3 bg-gray-200 text-gray-700 text-xs font-bold px-2 py-1 rounded-full">0</span>
                </h2>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="copyToClipboard()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition duration-200 shadow-sm">
                        <i class="fa-regular fa-copy mr-2"></i> Copy for Excel
                    </button>
                    <button onclick="downloadCSV()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition duration-200 shadow-sm">
                        <i class="fa-solid fa-file-csv mr-2"></i> Download CSV
                    </button>
                </div>
            </div>

            <div class="glass-panel rounded-xl overflow-hidden shadow-lg border-0 ring-1 ring-black ring-opacity-5">
                <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">#</th>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Latitude</th>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Longitude</th>
                                <th class="p-4 text-xs font-bold text-gray-500 uppercase tracking-wider border-b">Original Text</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody" class="bg-white divide-y divide-gray-100 text-sm text-gray-700">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="mt-8 text-center text-gray-400 text-sm">
                <p>Private & Secure. Calculations run locally in your browser.</p>
            </div>
        </div>
    </div>

    <script>
        // --- Logic Script ---
        let convertedData = [];

        function dmsToDecimal(degrees, minutes, seconds, direction) {
            let dd = parseFloat(degrees) + parseFloat(minutes) / 60 + parseFloat(seconds) / 3600;
            if (direction.toUpperCase() === 'S' || direction.toUpperCase() === 'W') {
                dd = dd * -1;
            }
            return dd.toFixed(6); 
        }

        function convertCoords() {
            const input = document.getElementById('inputData').value;
            const tableBody = document.getElementById('resultsTableBody');
            const resultsArea = document.getElementById('resultsArea');
            const countBadge = document.getElementById('countBadge');

            // Clear previous results
            tableBody.innerHTML = '';
            convertedData = [];

            // Regex for DMS formats
            const regex = /(\d+)°\s*(\d+)'\s*([\d\.]+)(?:''|"|”|″)\s*([NSEW])/gi;
            const matches = [...input.matchAll(regex)];

            if (matches.length === 0) {
                alert("No valid coordinates found! Please check your format.");
                return;
            }

            let pairCount = 0;

            for (let i = 0; i < matches.length; i += 2) {
                pairCount++;
                const latMatch = matches[i];
                const lonMatch = matches[i + 1]; 

                // Process Latitude
                const lat = dmsToDecimal(latMatch[1], latMatch[2], latMatch[3], latMatch[4]);
                
                // Process Longitude (handle single coordinates gracefully)
                let lon = "—";
                let originalText = latMatch[0];
                
                if (lonMatch) {
                    lon = dmsToDecimal(lonMatch[1], lonMatch[2], lonMatch[3], lonMatch[4]);
                    originalText += "   " + lonMatch[0];
                }

                convertedData.push({ lat, lon });

                // Add to table
                const row = `
                    <tr class="hover:bg-blue-50 transition-colors group">
                        <td class="p-4 text-gray-400 font-mono text-xs select-none">${pairCount}</td>
                        <td class="p-4 font-bold text-gray-800 font-mono select-all">${lat}</td>
                        <td class="p-4 font-bold text-gray-800 font-mono select-all">${lon}</td>
                        <td class="p-4 text-gray-400 text-xs truncate max-w-xs group-hover:text-gray-500">${originalText}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            }

            // Show UI
            resultsArea.classList.remove('hidden');
            countBadge.innerText = `${pairCount} Points`;
            
            // Auto scroll to results
            resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function clearInput() {
            document.getElementById('inputData').value = '';
            document.getElementById('resultsArea').classList.add('hidden');
            convertedData = [];
            document.getElementById('inputData').focus();
        }

        function copyToClipboard() {
            if (convertedData.length === 0) return;
            
            let text = "Latitude\tLongitude\n";
            convertedData.forEach(row => {
                text += `${row.lat}\t${row.lon}\n`;
            });

            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                // Temporary button feedback
                const btn = document.querySelector('button[onclick="copyToClipboard()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Copied!';
                btn.classList.add('bg-emerald-800');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-emerald-800');
                }, 2000);
            } catch (err) {
                alert("Failed to copy. Please check browser permissions.");
            }
            
            document.body.removeChild(textArea);
        }

        function downloadCSV() {
            if (convertedData.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,Latitude,Longitude\n";
            convertedData.forEach(row => {
                csvContent += `${row.lat},${row.lon}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "coordinates.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
